name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight
        # 빌드가 깨졌을 때 무엇이 설치됐는지부터 보이게 합니다.
        run: |
          node -v
          npm -v
          echo "electron:         $(node -p "require('electron/package.json').version" 2>&1)"
          echo "electron-builder: $(npx electron-builder --version 2>&1)"
          ls -la

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: npm run dist

      - name: Show output
        if: always()
        run: ls -la dist || echo "dist 없음"

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tokenbar-macos
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
